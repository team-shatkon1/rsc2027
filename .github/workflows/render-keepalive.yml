name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set yet. Please add your Render URL in GitHub Repository Secrets."
            exit 0
          fi
          echo "Pinging $URL/ping ..."
          curl -s -f "$URL/ping" || echo "Ping failed or server is waking up"
